<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="assets/manifest.webmanifest" />
<meta name="theme-color" content="#4AA3E4" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Baby Anderson" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<meta property="og:image:height" content="1200" />
<meta property="og:image:alt" content="Baby Anderson app badge — a stork carrying a smiling baby, with the words BABY ANDERSON" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Baby Anderson" />
<meta name="twitter:description" content="The Anderson family site for baby Trey — family tree, baby book, appointments, care team, and the hospital route. Due April 2, 2027." />
<meta name="twitter:image" content="https://baby-anderson.com/assets/og-image.png" />
<title>B-A.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --sky:#4AA3E4; --deep:#1D6FB8; --bundle:#A8D4F0; --gold:#F2B33D; --coral:#F07D2B; --cocoa:#8A5A3B;
  --bg:#F2F8FD; --surface:#FFFFFF; --surface2:#E8F3FC; --ink:#17334D; --muted:#54708C; --line:#C9E0F2;
  --band:#BFE0F7; --shadow:0 10px 30px rgba(29,111,184,.14);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0C1B2A; --surface:#12293F; --surface2:#17334D; --ink:#E8F3FC; --muted:#9DBBD6; --line:#26506F; --band:#173D5E; --shadow:0 10px 30px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Jost",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
h1,h2,h3,.disp{font-family:"Marcellus",serif;font-weight:400;letter-spacing:.01em}
img{max-width:100%}
a{color:var(--deep)}
@media (prefers-color-scheme: dark){ a{color:var(--bundle)} }
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
.btn{display:inline-block;background:var(--deep);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--sky)}
.btn.ghost{background:transparent;color:var(--deep);border:2px solid var(--deep)}
@media (prefers-color-scheme: dark){ .btn.ghost{color:var(--bundle);border-color:var(--bundle)} }
.btn.small{padding:6px 14px;font-size:14px}
.btn.gold{background:var(--gold);color:#4a3205}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600;color:var(--deep)}
@media (prefers-color-scheme: dark){ .chip{color:var(--bundle)} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}
.band{background:var(--band);border-radius:0 0 22px 22px;padding:26px 0 20px;margin-bottom:26px}
.band h1{margin:0;font-size:clamp(28px,4.5vw,42px);color:var(--deep)}
@media (prefers-color-scheme: dark){ .band h1{color:var(--bundle)} }
.band p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.grid{display:grid;gap:18px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.ph{width:100%;height:100%;object-fit:cover;object-position:50% 30%;background:var(--surface2);border-radius:12px;display:block}
.phwrap{background:var(--surface2);border-radius:12px;overflow:hidden}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding:22px 18px 34px;text-align:center;color:var(--muted);font-size:14px}
/* ---------- login ---------- */
#login{min-height:100vh;background:linear-gradient(180deg,#7FC1F2 0%,#A8D4F0 55%,#D8EDDC 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.storksky{position:absolute;top:6%;left:0;width:100%;height:180px;pointer-events:none}
.storkmove{animation:fly 13s ease-in-out infinite alternate;width:max-content}
@keyframes fly{from{transform:translateX(4vw)}to{transform:translateX(calc(100vw - 260px))}}
.wing{transform-origin:60px 42px;animation:flap .55s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(16deg)}to{transform:rotate(-24deg)}}
.wing2{transform-origin:86px 44px;animation:flap .55s ease-in-out infinite alternate-reverse}
@media (prefers-reduced-motion: reduce){ .storkmove,.wing,.wing2{animation:none} }
#login .brand{font-family:"Marcellus",serif;font-size:52px;color:#124E7E;letter-spacing:.04em;margin:110px 0 4px}
#login .tag{color:#2C6EA6;font-size:16px;margin:0 0 22px}
.logincard{background:rgba(255,255,255,.94);border-radius:20px;box-shadow:0 18px 44px rgba(18,78,126,.28);padding:28px;width:min(400px,94vw)}
.logincard label{display:block;font-weight:600;font-size:14.5px;color:#2C587E;margin:14px 0 5px}
.logincard input{width:100%;padding:12px 14px;border:1.5px solid #B7D6EF;border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:#17334D}
.logincard input:focus{outline:2px solid #4AA3E4;border-color:#4AA3E4}
.logincard .btn{width:100%;margin-top:20px;padding:13px;font-size:16.5px}
#loginerr{color:#B3261E;font-weight:600;min-height:1.4em;margin-top:12px;font-size:15px}
.loginopts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.logincard label.opt{display:inline-flex;align-items:center;gap:8px;margin:0;padding:9px 13px;background:#E8F3FC;border:1.5px solid #B7D6EF;border-radius:999px;font-size:14.5px;font-weight:600;color:#2C587E;cursor:pointer}
.logincard label.opt input{width:18px;height:18px;flex:0 0 18px;margin:0;padding:0;accent-color:#1D6FB8;cursor:pointer}
.savehint{margin:10px 2px 0;font-size:13.5px;line-height:1.45;color:#54708C}
/* ---------- app chrome ---------- */
#ticker{background:var(--deep);color:#EAF5FF;font-size:14.5px;padding:8px 14px;text-align:center;font-weight:500}
#ticker b{color:var(--gold)}
header.appbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.appbar .logo{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:"Marcellus",serif;font-size:19px;line-height:1.1;color:var(--deep);text-decoration:none;text-align:center;flex:0 0 auto}
.appbar .logo .logoname{white-space:nowrap}
@media (prefers-color-scheme: dark){ .appbar .logo{color:var(--bundle)} }
.appbar img.badge{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface2)}
nav.main{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.main a{padding:8px 11px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px}
nav.main a:hover,nav.main a.on{background:var(--surface2);color:var(--deep)}
@media (prefers-color-scheme: dark){ nav.main a:hover,nav.main a.on{color:var(--bundle)} }
.hero{text-align:center;padding:14px 0 6px}
.hero img.badge{width:min(168px,48vw);height:min(168px,48vw);object-fit:cover;background:#fff;border:1px solid #DCEBF5;border-radius:26px;box-shadow:0 12px 30px rgba(29,111,184,.20)}
.hero h1{font-size:clamp(34px,6vw,56px);margin:8px 0 2px;color:var(--deep)}
@media (prefers-color-scheme: dark){ .hero h1{color:var(--bundle)} }
.countnums{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.countnums .n{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 18px;min-width:96px}
.countnums .n b{display:block;font-size:30px;font-family:"Marcellus",serif;color:var(--deep)}
@media (prefers-color-scheme: dark){ .countnums .n b{color:var(--bundle)} }
.countnums .n span{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:14px}
.pcell{cursor:pointer}
.pcell .phwrap{aspect-ratio:4/3.4}
.pcell figcaption{font-size:14px;color:var(--muted);padding:7px 2px 0;line-height:1.35}
.treegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:center;cursor:pointer;text-decoration:none;color:var(--ink);display:block}
.mcard:hover{border-color:var(--sky)}
.mcard .phwrap{aspect-ratio:1/1.08;border-radius:12px;margin-bottom:10px}
.mcard .initials{font-family:"Marcellus",serif;font-size:40px;color:var(--bundle);display:flex;align-items:center;justify-content:center;height:100%}
.mcard h3{margin:2px 0 3px;font-size:18.5px;line-height:1.2}
.mcard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.35}
.checkrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;font-size:16px;color:var(--ink)}
.checkrow .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--sky);margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.checkrow.done .box{background:var(--sky)}
.checkrow.done .t{text-decoration:line-through;color:var(--muted)}
.checkrow small{display:block;color:var(--muted);font-size:13.5px}
input[type=text],input[type=search],input[type=date],textarea,select{font-family:inherit;font-size:15.5px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--muted)}
table.dt{width:100%;border-collapse:collapse;font-size:15px}
table.dt th{text-align:left;padding:8px;border-bottom:2px solid var(--line);color:var(--muted)}
table.dt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
#lightbox{position:fixed;inset:0;background:rgba(6,20,33,.93);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lightbox.open{display:flex}
#lightbox img{max-width:94vw;max-height:76vh;object-fit:contain;border-radius:10px}
#lightbox p{color:#D8EDFB;max-width:70ch;text-align:center}
.tl{border-left:3px solid var(--bundle);margin-left:8px;padding-left:22px}
.tl .ev{position:relative;margin-bottom:26px}
.tl .ev::before{content:"";position:absolute;left:-31px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--gold);border:3px solid var(--surface)}
.tl .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tl .thumbs .phwrap{width:110px;height:86px;cursor:pointer}
.notice{background:#FFF6DE;border:1px solid #EBD28A;color:#5C4303;border-radius:12px;padding:13px 16px;font-size:15px}
@media (prefers-color-scheme: dark){ .notice{background:#3A2E08;color:#F2D98C;border-color:#6B5510} }
.emerg{background:#FDECEA;border:2px solid #D64541;border-radius:16px;padding:20px}
@media (prefers-color-scheme: dark){ .emerg{background:#3A1210;border-color:#D64541} }
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tabs a{padding:8px 16px;border-radius:999px;border:1.5px solid var(--deep);color:var(--deep);text-decoration:none;font-weight:600;font-size:14.5px}
.tabs a.on{background:var(--deep);color:#fff}
@media (prefers-color-scheme: dark){ .tabs a{border-color:var(--bundle);color:var(--bundle)} .tabs a.on{background:var(--deep);color:#fff} }
@media (max-width:640px){ nav.main a{padding:7px 8px;font-size:13.5px} .appbar .logo{font-size:18px} }
html,body{overflow-x:clip}
/* ---------- app bar: brand row, then nav row (phones & small tablets) ---------- */
@media (max-width:900px){
  .appbar .row{flex-wrap:wrap;gap:8px 10px;padding:10px 12px}
  .appbar .logo{order:1}
  #installBtn{order:2;margin-left:auto}
  nav.main{order:3;flex:1 1 100%;margin-left:0}
}
/* ---------- Timelines dropdown ---------- */
.navdd{position:relative;display:inline-block}
.navdd-btn{padding:8px 11px;border-radius:999px;border:none;background:none;color:var(--ink);font-weight:600;font-size:14.5px;font-family:inherit;cursor:pointer}
.navdd-btn:hover,.navdd-btn.on{background:var(--surface2);color:var(--deep)}
@media (prefers-color-scheme: dark){ .navdd-btn:hover,.navdd-btn.on{color:var(--bundle)} }
.navdd-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:218px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;z-index:70;text-align:left}
.navdd.open .navdd-menu{display:block}
.navdd-menu a{display:block;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.navdd-menu a:hover{background:var(--surface2);color:var(--deep)}
@media (prefers-color-scheme: dark){ .navdd-menu a:hover{color:var(--bundle)} }
.navdd-menu a small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;white-space:normal}
@media (max-width:640px){ .navdd-btn{padding:7px 8px;font-size:13.5px} .navdd-menu{left:50%;transform:translateX(-50%)} }
/* ---------- cohesion: one rhythm across every page ---------- */
main h2{font-size:clamp(24px,3.4vw,31px);line-height:1.2;margin:32px 0 12px}
main h3{font-size:20px;line-height:1.28}
main .band + .wrap > h2:first-child{margin-top:2px}
.card h2:first-child,.card h3:first-child{margin-top:0}
.card p:last-child{margin-bottom:0}
/* ---------- timeline status ---------- */
.tl .ev.future::before{background:var(--surface);border:3px solid var(--sky)}
.tl .ev .st{margin-left:8px;vertical-align:2px}
/* ---------- family tree ---------- */
.treebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.treebar .btn{padding:7px 14px}
.treeview{overflow:auto;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#E3F1FD 0%,#F4FAFF 55%,#EDF6EC 100%);height:min(74vh,760px);-webkit-overflow-scrolling:touch}
@media (prefers-color-scheme: dark){ .treeview{background:linear-gradient(180deg,#0E2438 0%,#0C1B2A 60%,#0D2115 100%)} }
.treesizer{position:relative}
.treecanvas{position:absolute;top:0;left:0;transform-origin:0 0}
.tnode{position:absolute;width:132px;margin-left:-66px;text-align:center;text-decoration:none;color:var(--ink)}
.tface{border-radius:50%;overflow:hidden;margin:0 auto;border:3px solid #fff;box-shadow:0 5px 16px rgba(23,51,77,.28);background:var(--surface2);display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme: dark){ .tface{border-color:#D8EDFB} }
.tface img.timg{width:100%;height:100%;object-fit:cover;object-position:50% 22%;transform:scale(1.45);display:block}
.tface img.timg.badgeimg{object-position:50% 50%;transform:scale(1.12)}
.tface .initials{font-family:"Marcellus",serif;color:var(--deep)}
@media (prefers-color-scheme: dark){ .tface .initials{color:var(--bundle)} }
.tname{display:block;font-weight:600;font-size:13.5px;line-height:1.15;margin-top:6px}
.trel{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.treelinks p{margin:4px 0;font-size:15px}
/* ---------- live map ---------- */
.mapwrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface2)}
.mapwrap iframe{display:block;width:100%;height:430px;border:0}
@media (max-width:640px){ .mapwrap iframe{height:320px} }
.earthpanel{display:block;text-decoration:none;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:linear-gradient(140deg,#0B2A47 0%,#14507E 45%,#2E6B46 100%);color:#fff;padding:32px 22px 28px;text-align:center;margin-top:22px}
.earthpanel h3{font-family:"Marcellus",serif;font-size:clamp(23px,3.6vw,32px);margin:0 0 8px;color:#fff}
.earthpanel p{margin:0 auto 16px;max-width:58ch;color:#DCEBF7}
.earthpanel .btnlike{display:inline-block;background:var(--gold);color:#4a3205;border-radius:999px;padding:11px 22px;font-weight:600;font-size:15.5px}
.earthpanel:hover .btnlike{background:#FFC95E}
/* ---------- tables & counters stack on phones ---------- */
@media (max-width:640px){
  table.dt,table.dt tbody,table.dt tr,table.dt td{display:block;width:100%}
  table.dt th{display:none}
  table.dt tr{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;margin-bottom:10px}
  table.dt td{border-bottom:none;padding:3px 0}
  .countnums .n{min-width:82px;padding:10px 12px;flex:1 1 38%}
  .countnums .n b{font-size:26px}
  #ticker{font-size:13.5px}
}

/* ---------- stork band (below the ticker, every page) ---------- */
#storkband{height:54px;overflow:hidden;position:relative;background:linear-gradient(180deg,#A8D4F0 0%,#D8EDFB 78%,#EAF6FF 100%);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){ #storkband{background:linear-gradient(180deg,#123453 0%,#173D5E 78%,#1B476B 100%)} }
.storkmove2{animation:storkfly 17s linear infinite;width:max-content;padding-top:1px}
@keyframes storkfly{from{transform:translateX(-230px)}to{transform:translateX(100vw)}}
@media (prefers-reduced-motion: reduce){ .storkmove2{animation:none;transform:translateX(12vw)} }
/* ---------- trimester scale (home) ---------- */
.triscale{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px 14px;margin:18px 0 6px;text-align:left}
.triscale .ts-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.triscale .ts-head h2{margin:0;font-size:22px}
.triscale .ts-pct{font-family:"Marcellus",serif;font-size:30px;color:var(--deep)}
@media (prefers-color-scheme: dark){ .triscale .ts-pct{color:var(--gold)} }
.triscale .ts-track{position:relative;display:flex;height:26px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.triscale .ts-seg{height:100%}
.triscale .ts-seg.s1{background:#BFE3C6}.triscale .ts-seg.s2{background:#F7D774}.triscale .ts-seg.s3{background:#F5B98A}
@media (prefers-color-scheme: dark){ .triscale .ts-seg.s1{background:#2E5D3A}.triscale .ts-seg.s2{background:#7A5F14}.triscale .ts-seg.s3{background:#7A4416} }
.triscale .ts-fill{position:absolute;top:0;left:0;bottom:0;background:var(--deep);opacity:.88;border-right:3px solid #fff}
.triscale .ts-fill span{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#fff;font-weight:700;font-size:13.5px;white-space:nowrap}
.triscale .ts-labels{display:flex;margin-top:8px}
.triscale .ts-lab{font-size:13.5px;color:var(--muted);line-height:1.3;padding-right:8px}
.triscale .ts-lab b{color:var(--ink);font-size:14.5px}
.triscale .ts-lab.now b{color:var(--deep)}
@media (prefers-color-scheme: dark){ .triscale .ts-lab.now b{color:var(--gold)} }
.triscale .ts-here{display:inline-block;background:var(--gold);color:#4a3205;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;margin-left:5px;vertical-align:1px}
@media (max-width:640px){ .triscale{padding:14px 14px 10px} .triscale .ts-pct{font-size:25px} .triscale .ts-lab{font-size:12px} .triscale .ts-lab b{font-size:12.5px} }
/* ---------- fruit & veg size cartoons ---------- */
.sizeart{width:64px;height:64px;flex:0 0 64px}
.sizecell{display:flex;align-items:center;gap:12px}
.sizecell .sz-t{min-width:0}
.thisweek{display:flex;gap:16px;align-items:flex-start}
.thisweek .sizeart{width:104px;height:104px;flex-basis:104px}
@media (max-width:640px){ .thisweek .sizeart{width:82px;height:82px;flex-basis:82px} .sizeart{width:54px;height:54px;flex-basis:54px} }
/* ---------- tree headshots (pre-cropped solo portraits) ---------- */
.tface img.timg.hs{transform:none;object-position:50% 50%}
/* ---------- polaroid photo frames ---------- */
.pcell .phwrap,.tl .thumbs .phwrap,.grid>.phwrap{background:#fff;padding:7px 7px 22px;border-radius:5px;box-shadow:0 8px 22px rgba(23,51,77,.20);border:1px solid #E3EAF0}
.pcell .phwrap .ph,.tl .thumbs .phwrap .ph,.grid>.phwrap .ph{border-radius:2px}
.tl .thumbs .phwrap{width:118px;height:104px}
/* ---------- inline icons ---------- */
.ic{width:19px;height:19px;vertical-align:-4px;margin-right:6px;color:var(--deep);flex:0 0 auto}
@media (prefers-color-scheme: dark){ .ic{color:var(--gold)} }
.ic.big{width:34px;height:34px;margin:0 0 6px}
h2 .ic,h3 .ic{width:21px;height:21px}

/* ---------- Trey's Profile (ESPN-style) ---------- */
.gdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#2FA84F;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 3px rgba(47,168,79,.18)}
.prohero{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){ .prohero{grid-template-columns:1fr} }
.prophoto{background:#fff;padding:9px 9px 30px;border-radius:5px;box-shadow:0 10px 26px rgba(23,51,77,.22);border:1px solid #E3EAF0}
.prophoto .ph{border-radius:2px;aspect-ratio:4/4.6}
.proname{font-family:"Marcellus",serif;line-height:1.02;margin:2px 0 0}
.proname .fn{display:block;font-size:clamp(30px,4vw,42px);letter-spacing:.06em;color:var(--muted)}
.proname .ln{display:block;font-size:clamp(38px,5vw,54px);letter-spacing:.03em;color:var(--ink)}
.prosub{font-size:17px;font-weight:600;color:var(--deep);margin:12px 0 0}
@media (prefers-color-scheme: dark){ .prosub{color:var(--bundle)} }
.pinfo{border-left:1px solid var(--line);padding-left:22px}
@media (max-width:860px){ .pinfo{border-left:none;padding-left:0} }
.pinfo .r{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.pinfo .r:last-child{border-bottom:none}
.pinfo .k{flex:0 0 128px;font-size:12.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);padding-top:3px}
.pinfo .v{font-weight:600;font-size:16.5px}
.statstrip{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface);margin-top:20px}
.statstrip .ss-head{background:var(--deep);color:#fff;font-weight:700;letter-spacing:.08em;text-align:center;padding:9px;font-size:15px}
.statstrip .ss-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.statstrip .ss-cell{text-align:center;padding:14px 6px 12px;border-right:1px solid var(--line)}
.statstrip .ss-cell:last-child{border-right:none}
.statstrip .ss-cell small{display:block;color:var(--muted);font-weight:700;letter-spacing:.08em;font-size:12.5px}
.statstrip .ss-cell b{font-family:"Marcellus",serif;font-size:clamp(24px,4vw,34px);color:var(--deep)}
@media (prefers-color-scheme: dark){ .statstrip .ss-cell b{color:var(--bundle)} }
@media (max-width:560px){ .statstrip .ss-grid{grid-template-columns:repeat(2,1fr)} .statstrip .ss-cell{border-bottom:1px solid var(--line)} }
.healthrow{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
.healthrow .sc{font-family:"Marcellus",serif;font-size:21px;flex:0 0 52px;color:var(--deep)}
@media (prefers-color-scheme: dark){ .healthrow .sc{color:var(--bundle)} }
.healthrow.on{border:2px solid #2FA84F;background:#EAF7EE}
@media (prefers-color-scheme: dark){ .healthrow.on{background:#12351D} }
.scanrow{display:flex;gap:13px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--line)}
.scanrow:last-child{border-bottom:none}
.scanrow h3{margin:0;font-size:18px}
.scanrow p{margin:3px 0 0;color:var(--muted);font-size:15px}
.scanbadge{display:inline-block;background:#EAF7EE;color:#177245;border:1px solid #9BD3A8;border-radius:999px;padding:2px 11px;font-size:13.5px;font-weight:700;white-space:nowrap;margin-top:2px}
@media (prefers-color-scheme: dark){ .scanbadge{background:#12351D;color:#8FE0A6;border-color:#2FA84F} }
</style>
</head>

function hexToBytes(h){ var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
function bufToHex(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

document.getElementById("loginform").addEventListener("submit", function(ev){
  ev.preventDefault();
  var u = document.getElementById("lu").value.trim().toLowerCase();
  var p = document.getElementById("lp").value;
  var err = document.getElementById("loginerr");
  var btn = document.getElementById("loginbtn");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Signing in…";
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(p)).then(function(hbuf){
    var hex = bufToHex(hbuf);
    if (u !== EXPECTED_USER || hex !== EXPECTED_HASH) throw new Error("bad");
    return crypto.subtle.importKey("raw", hexToBytes(hex), {name:"AES-GCM"}, false, ["decrypt"]);
  }).then(function(k){
    KEY = k;
    var raw = atob(PAYLOAD_B64); var bytes = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) bytes[i] = raw.charCodeAt(i);
    return crypto.subtle.decrypt({name:"AES-GCM", iv: bytes.slice(0,12)}, KEY, bytes.slice(12));
  }).then(function(plain){
    DATA = JSON.parse(new TextDecoder().decode(plain));
    var saveBox = document.getElementById("savelogin");
    if (saveBox && saveBox.checked && window.PasswordCredential && navigator.credentials && navigator.credentials.store) {
      try {
        navigator.credentials.store(new PasswordCredential({ id: u, name: u, password: p })).catch(function(){});
      } catch (e) {}
    }
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    buildNav(); startTicker(); route(); hydrateImages(document);
  }).catch(function(){
    err.textContent = "That username or password doesn't match.";
    btn.disabled = false; btn.textContent = "Sign in";
  });
});

/* ---------- encrypted photo pipeline ---------- */
function decryptFile(filename){
  if (blobCache[filename]) return Promise.resolve(blobCache[filename]);
  var meta = DATA.fileMap[filename];
  if (!meta) return Promise.reject(new Error("no file"));
  return fetch("assets/" + meta.enc).then(function(r){ return r.arrayBuffer(); }).then(function(buf){
    return crypto.subtle.decrypt({name:"AES-GCM", iv: new Uint8Array(buf.slice(0,12))}, KEY, buf.slice(12));
  }).then(function(plain){
    var blob = new Blob([plain], {type: meta.mime});
    blobRaw[filename] = blob;
    blobCache[filename] = URL.createObjectURL(blob);
    return blobCache[filename];
  });
}
var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if (!e.isIntersecting) return;
    var el = e.target; io.unobserve(el);
    decryptFile(el.getAttribute("data-ph")).then(function(url){
      if (el.tagName === "IMG") el.src = url; else el.style.backgroundImage = "url(" + url + ")";
    }).catch(function(){});
  });
}, {rootMargin: "300px"}) : null;
function hydrateImages(root){
  var els = root.querySelectorAll("[data-ph]");
  els.forEach(function(el){
    var fn = el.getAttribute("data-ph");
    if (blobCache[fn]) { if (el.tagName==="IMG") el.src = blobCache[fn]; return; }
    if (io) io.observe(el); else decryptFile(fn).then(function(u){ if(el.tagName==="IMG") el.src=u; }).catch(function(){});
  });
}
function phImg(filename, caption, cls){
  return '<img class="' + (cls||"ph") + '" data-ph="' + esc(filename) + '" alt="' + esc(caption||"") + '" loading="lazy" />';
}
function photoCell(p){
  return '<figure class="pcell" style="margin:0" data-open-photo="' + esc(p.src) + '" data-cap="' + esc(p.caption) + '"><div class="phwrap">' + phImg(p.src, p.caption) + '</div><figcaption>' + esc(p.caption) + '</figcaption></figure>';
}
function downloadBlob(blob, name){
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 400);
}
function downloadPhoto(filename){
  decryptFile(filename).then(function(){ downloadBlob(blobRaw[filename], filename); });
}

/* ---------- ticker / dates ---------- */
function gaInfo(){
  var now = new Date(); now.setHours(0,0,0,0);
  var transfer = new Date(2026, 6, 15);           // Jul 15 2026 = 2w5d
  var gaDays = Math.floor((now - transfer)/86400000) + 19;
  var due = new Date(2027, 3, 2);
  var left = Math.floor((due - now)/86400000);
  var wk = Math.floor(gaDays/7), dy = gaDays%7;
  var tri = wk < 14 ? "First trimester" : (wk < 28 ? "Second trimester" : "Third trimester");
  var mLeft = Math.floor(left/30.44), wLeft = Math.floor((left - mLeft*30.44)/7), dLeft = Math.round(left - mLeft*30.44 - wLeft*7);
  return {wk:wk, dy:dy, tri:tri, left:left, mLeft:mLeft, wLeft:wLeft, dLeft:dLeft};
}
function startTicker(){
  var g = gaInfo();
  document.getElementById("ticker").innerHTML =
    "Trey is <b>" + g.wk + " weeks, " + g.dy + " days</b> along · " + g.tri +
    " · <b>" + g.left + " days</b> to go (" + g.mLeft + " mo, " + g.wLeft + " wk, " + g.dLeft + " d) · Due <b>April 2, 2027</b> · Last heartbeat <b>147 BPM</b> · Weight <b>13 oz</b>";
}

function buildNav(){
  var dd = '<span class="navdd" id="navdd"><button type="button" class="navdd-btn" data-nav="timelines" aria-haspopup="true" aria-expanded="false">Timelines ▾</button>' +
    '<span class="navdd-menu">' +

    '<a href="#timelines/pregnancy">Pregnancy Timeline<small>Milestones to April 2, 2027</small></a>' +
    '</span></span>';
  var html = "";
  NAV.forEach(function(n){
    html += '<a href="#' + n[0] + '" data-nav="' + n[0] + '">' + n[1] + '</a>';
    if (n[0] === "journey") html += dd;
  });
  var nav = document.getElementById("mainnav");
  nav.innerHTML = html;
  var wrap = document.getElementById("navdd");
  var btn = wrap.querySelector(".navdd-btn");
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    var open = wrap.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  wrap.querySelector(".navdd-menu").addEventListener("click", function(){ wrap.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); });
  document.addEventListener("click", function(e){ if (!wrap.contains(e.target)) wrap.classList.remove("open"); });
}
function route(){
  if (!DATA) return;
  var hash = location.hash.replace(/^#\/?/, "");
  var parts = hash.split("/"); var page = parts[0] || "home";
  document.querySelectorAll("[data-nav]").forEach(function(a){
    a.classList.toggle("on", a.getAttribute("data-nav") === page || (page==="member" && a.getAttribute("data-nav")==="tree") || (page==="gallery" && a.getAttribute("data-nav")==="babybook"));
  });
  var v = document.getElementById("view");
  var nd = document.getElementById("navdd");
  if (nd) nd.classList.remove("open");
  var html = "";
  try {
    if (page === "home") html = pageHome();
    else if (page === "tree") html = pageTree();
    else if (page === "profile") html = pageProfile();
    else if (page === "member") html = pageMember(parts[1]);
    else if (page === "babybook") html = pageBabyBook(parts[1] || "pregnancy");
    else if (page === "journey") html = pageJourney();
    else if (page === "timelines") html = pageTimeline(parts[1] || "couple");
    else if (page === "appointments") html = pageAppointments();
    else if (page === "care") html = pageCare();
    else if (page === "route") html = pageRoute();
    else if (page === "lists") html = pageLists(parts[1] || "prep");
    else if (page === "registry") html = pageRegistry(parts[1] || "list");
    else if (page === "names") html = pageNames();
    else if (page === "learn") html = pageLearn(parts[1] || "safety");
    else if (page === "downloads") html = pageDownloads();
    else html = pageHome();
  } catch(e){ html = '<div class="wrap"><div class="card" style="margin-top:24px">Something went wrong rendering this page.</div></div>'; }
  v.innerHTML = html;
  window.scrollTo(0,0);
  hydrateImages(v); bindPage(page, parts);
}

/* ================= TIMELINES ================= */

}

  var chip = st === "done" ? ' <span class="chip st">✓ Done</span>' : (st === "future" ? ' <span class="chip st">Ahead</span>' : '');
  var h = '<div class="ev' + (st === "future" ? ' future' : '') + '"><h3 style="margin:0">' + ic(ev.ic || "star") + esc(ev.title) + chip + '</h3>' +
    '<p style="margin:2px 0;color:var(--muted);font-weight:600">' + esc(ev.date) + (ev.ga ? ' · ' + esc(ev.ga) : '') + '</p>' +
    (ev.note ? '<p style="margin:4px 0">' + esc(ev.note) + '</p>' : '');
  if (ev.photoKeys && ev.photoKeys.length){
    h += '<div class="thumbs">' + ev.photoKeys.map(function(k){
      var p = photoByKey(k); if (!p) return "";

    }).join("") + '</div>';
  }
  return h + '</div>';
}

  var h = band("Timelines", "") +

function checklistHTML(listName){
  var items = DATA.checklists.filter(function(c){ return c.list===listName; });
  state.addedItems.filter(function(c){ return c.list===listName; }).forEach(function(c){ items.push(c); });
  var cats = [], seen = {};
  items.forEach(function(it){ if (!seen[it.category]) { seen[it.category]=1; cats.push(it.category); } });
  var out = "";
  cats.forEach(function(cat){
    out += '<h3>' + ic("list") + esc(cat) + '</h3>';
    items.filter(function(it){ return it.category===cat; }).forEach(function(it){
      var key = listName + "|" + it.title;
      var done = !!state.checked[key];
      out += '<button type="button" class="checkrow' + (done?' done':'') + '" data-check="' + esc(key) + '"><span class="box">' + (done?'✓':'') + '</span><span class="t"><b>' + esc(it.title) + '</b>' +
        (it.detail ? '<small>' + esc(it.detail) + '</small>' : '') +
        (it.retailer ? '<small>🛒 ' + esc(it.retailer) + (it.brands ? ' — ' + esc(it.brands) : '') + '</small>' : '') +
        (it.qty ? '<small>Quantity: ' + it.qty + '</small>' : '') + '</span></button>';
    });
  });
  return out;
}

function bindPage(page, parts){
  var v = document.getElementById("view");
  v.querySelectorAll("[data-open-photo]").forEach(function(el){
    el.addEventListener("click", function(){ openLightbox(el.getAttribute("data-open-photo"), el.getAttribute("data-cap")||""); });
  });
  v.querySelectorAll("[data-check]").forEach(function(el){
    el.addEventListener("click", function(){
      var k = el.getAttribute("data-check");
      state.checked[k] = !state.checked[k]; route();
    });
  });
  if (page === "tree") initTreeZoom();
  if (page === "member"){
    v.querySelectorAll("[data-member-field]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var slug = parts[1]; if (!state.memberEdits[slug]) state.memberEdits[slug] = {};
        state.memberEdits[slug][inp.getAttribute("data-member-field")] = inp.value;
      });
    });
  }
  if (page === "appointments"){
    var ta = document.getElementById("appt-notes");
    if (ta) ta.addEventListener("input", function(){ state.apptNotes = ta.value; });
  }
  if (page === "lists"){
    var btn = document.getElementById("add-item-btn");
    if (btn) btn.addEventListener("click", function(){
      var inp = document.getElementById("add-item"); var t = inp.value.trim(); if (!t) return;
      state.addedItems.push({list: parts[1]||"prep", category:"Added by the family", title:t}); route();
    });
  }
  if (page === "registry" && (parts[1]||"list") === "supplies"){
    var res = document.getElementById("supply-results"); var q = document.getElementById("supply-q");
    res.innerHTML = supplyResults("");
    q.addEventListener("input", function(){ res.innerHTML = supplyResults(q.value); });
  }
  if (page === "names"){
    var res2 = document.getElementById("name-results"); var q2 = document.getElementById("name-q");
    res2.innerHTML = nameResults("");
    q2.addEventListener("input", function(){ res2.innerHTML = nameResults(q2.value); });
    v.querySelectorAll("[data-fav]").forEach(function(b){
      b.addEventListener("click", function(){
        var n = b.getAttribute("data-fav"); var i = state.favorites.indexOf(n);
        if (i>=0) state.favorites.splice(i,1); else state.favorites.push(n); route();
      });
    });
    var lb = document.getElementById("lineage-btn");
    if (lb) lb.addEventListener("click", function(){
      var inp = document.getElementById("lineage-in"); var t = inp.value.trim(); if (!t) return;
      state.lineage.push(t); route();
    });
  }
  if (page === "learn" && (parts[1]||"safety") === "safety"){
    var res3 = document.getElementById("safety-results"); var q3 = document.getElementById("safety-q");
    res3.innerHTML = safetyResults("");
    q3.addEventListener("input", function(){ res3.innerHTML = safetyResults(q3.value); });
  }
  if (page === "downloads"){
    var ib2 = document.getElementById("installBtn2");
    if (ib2) ib2.addEventListener("click", doInstall);
    updateInstallUI();
    v.querySelectorAll("[data-dl]").forEach(function(b){
      b.addEventListener("click", function(){ downloadPhoto(b.getAttribute("data-dl")); });
    });
    document.getElementById("json-btn").addEventListener("click", function(){
      var backup = { site:"Baby Anderson — website edition", version:"v1.49", exported:new Date().toISOString(), sessionEdits: state, data: DATA };
      downloadBlob(new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"}), "baby-anderson-backup.json");
    });
    document.getElementById("planner-btn").addEventListener("click", function(){
      var rows = DATA.appointments.map(function(a){ return "<tr><td>" + esc(a.date) + "</td><td>" + esc(a.title) + "</td><td>" + esc(a.location||"") + "</td><td>" + esc(a.notes||"") + "</td></tr>"; }).join("");
      var lists = ["prep","hospital","overall","babylist"].map(function(ln){
        var items = DATA.checklists.filter(function(c){ return c.list===ln; });
        return "<h2>" + ln + "</h2><ul>" + items.map(function(it){ return "<li>" + (state.checked[ln+"|"+it.title] ? "☑ " : "☐ ") + esc(it.title) + "</li>"; }).join("") + "</ul>";
      }).join("");
      var doc = "<!doctype html><html><head><meta charset='utf-8'><title>Baby Anderson — Planner</title><style>body{font-family:Georgia,serif;margin:40px;color:#17334D}table{border-collapse:collapse}td,th{border:1px solid #999;padding:6px 10px;text-align:left}</style></head><body><h1>Baby Anderson — Appointments &amp; Checklists</h1><p>Jonathan Malick Anderson (“Trey”) · Due April 2, 2027 · Last heartbeat 147 BPM</p><table><tr><th>Date</th><th>Appointment</th><th>Where</th><th>Notes</th></tr>" + rows + "</table>" + lists + "</body></html>";
      downloadBlob(new Blob([doc], {type:"text/html"}), "baby-anderson-planner.html");
    });
    document.getElementById("zip-btn").addEventListener("click", function(){
      var st = document.getElementById("zip-status"); var btn = this; btn.disabled = true;
      var zip = new JSZip(); var done = 0; var list = DATA.photos.slice();
      function next(){
        if (!list.length){
          st.textContent = "Zipping…";
          zip.generateAsync({type:"blob"}).then(function(blob){
            downloadBlob(blob, "baby-anderson-photos.zip");
            st.textContent = "Done — " + done + " photos saved."; btn.disabled = false;
          });
          return;
        }
        var p = list.shift();
        decryptFile(p.src).then(function(){
          return blobRaw[p.src].arrayBuffer();
        }).then(function(ab){
          zip.file(p.src, ab); done++;
          st.textContent = "Decrypting photos… " + done + " of " + DATA.photos.length;
          next();
        }).catch(function(){ next(); });
      }
      next();
    });
  }
}

  lbFile = filename;
  document.getElementById("lbcap").textContent = caption || captionForFile(filename);
  var img = document.getElementById("lbimg"); img.removeAttribute("src");
  decryptFile(filename).then(function(url){ img.src = url; }).catch(function(){});
  document.getElementById("lightbox").classList.add("open");
}

/* ---------- desktop install (PWA) ---------- */
var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallUI();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  updateInstallUI();
});
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
function updateInstallUI(){
  var standalone = isStandalone();
  document.querySelectorAll(".js-install").forEach(function(b){
    if (standalone) b.hidden = true;
    else if (b.id === "installBtn") b.hidden = !deferredInstallPrompt;
    else b.hidden = false;
  });
  var note = document.getElementById("installNote");
  if (note) note.textContent = standalone ? "You’re using the installed app right now." :
    (deferredInstallPrompt ? "Your browser is ready — one click installs it." :
    "If no install window opens, follow the steps for your browser below.");
}
function doInstall(){
  if (deferredInstallPrompt){
    // the browser's own install offer (BeforeInstallPromptEvent) — not a page dialog;
    // where no offer exists, the in-page instructions below are the install path
    deferredInstallPrompt["prompt"]();
    deferredInstallPrompt.userChoice.then(function(){ deferredInstallPrompt = null; updateInstallUI(); });
  } else {
    var help = document.getElementById("installHelp");
    if (help) help.scrollIntoView({behavior:"smooth", block:"center"});
    else location.hash = "#downloads";
  }
}
document.getElementById("installBtn").addEventListener("click", doInstall);
updateInstallUI();
